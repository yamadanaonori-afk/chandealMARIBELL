<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>製品レジ</title>
<style>
:root{--red:#d6001c;--line:#d9d2c4;--bg:#faf8f3;--gold:#b89a5a;--ink:#222;--muted:#999}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:"Hiragino Sans","Noto Sans JP",sans-serif;background:var(--bg);color:var(--ink);padding-bottom:120px}
header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:2px solid var(--gold);display:flex;align-items:center;gap:8px;padding:8px 12px}
header h1{font-size:17px;margin:0;flex:1;letter-spacing:.1em}
.hbtn{border:1px solid var(--red);border-radius:20px;padding:8px 12px;font-weight:700;font-size:13px;color:var(--red);background:#fff}
.hbtn.armed,.clear.armed{background:var(--red)!important;color:#fff!important}
.mode{border:0;border-radius:20px;padding:8px 14px;font-weight:700;font-size:14px;color:#fff;background:#2b7a3d}
.mode.minus{background:var(--red)}
.page{margin:12px 8px 20px}
.page h2{font-size:15px;color:#555;margin:0 0 8px 2px;display:flex;align-items:center;gap:8px}
.cat{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:6px;background:var(--gold);color:#fff;font-size:18px;font-weight:700}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);background:#fff;border-radius:6px}
table{border-collapse:collapse;width:100%}
th,td{border:1px solid var(--line);vertical-align:top;padding:6px}
thead th{background:#f3eee2;text-align:left;min-width:150px}
thead th.corner{min-width:28px;width:28px;background:#fff}
.cname{font-size:14px;font-weight:700}
.csub{font-size:10px;color:#777;font-weight:400;margin:2px 0 4px}
.hchips{display:flex;flex-wrap:wrap;gap:2px}
.hchip{font-size:9px;padding:2px 4px;border-radius:2px;line-height:1.2}
tbody th{writing-mode:vertical-rl;background:#f3eee2;font-size:12px;letter-spacing:.2em;padding:6px 4px;border-left:4px solid var(--gold)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.grid.wide{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.card{background:#fff;border:1px solid var(--line);border-radius:6px;padding:8px}
.cser{font-size:10px;color:var(--gold)}
.empty{color:#ccc;text-align:center;padding-top:16px}
.item{margin-bottom:10px}
.item:last-child{margin-bottom:0}
.iname{font-size:11px;color:#555}
.price{font-weight:700;color:var(--red);font-size:15px}
.price small{font-size:10px;font-weight:400}
.sw{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.btn{position:relative;width:60px;border-radius:6px;border:2px solid transparent;background:#fff;padding:2px;cursor:pointer;user-select:none;transition:transform .08s;text-align:center}
.btn img{display:block;width:52px;height:52px;object-fit:contain;margin:0 auto;pointer-events:none}
.btn .noimg{width:52px;height:52px;margin:0 auto;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:10px;line-height:1.2;opacity:.85}
.btn .code{display:block;font-size:11px;font-weight:700;margin-top:2px;border-radius:3px;padding:1px 0}
.btn:active{transform:scale(.92)}
.btn.sel{border-color:#ff9800;background:#fff4e0;box-shadow:0 0 0 1px #ff9800}
.btn .q{position:absolute;top:-8px;right:-8px;background:#ff9800;color:#fff;border-radius:10px;min-width:20px;height:20px;font-size:12px;line-height:20px;padding:0 5px;display:none}
.btn.sel .q{display:block}
.gap{width:60px;height:76px;display:flex;align-items:center;justify-content:center;color:#ccc}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#222;color:#fff;padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:10px}
.bar .cnt{font-size:12px;opacity:.8}
.bar .tot{font-size:24px;font-weight:700;flex:1;text-align:right}
.bar .tot small{display:block;font-size:11px;font-weight:400;opacity:.7}
.bar button{border:0;border-radius:6px;padding:10px 12px;font-weight:700}
.detail{position:fixed;left:0;right:0;bottom:70px;z-index:25;background:#fff;border-top:2px solid var(--gold);max-height:55vh;overflow:auto;padding:10px 14px;display:none;box-shadow:0 -4px 12px rgba(0,0,0,.15)}
.detail.open{display:block}
.line{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #eee;font-size:13px}
.line .n{flex:1}
.line .n small{color:#777}
.line button{width:30px;height:30px;border-radius:15px;border:1px solid #ccc;background:#fff;font-size:16px}
.line .s{width:80px;text-align:right;font-weight:700}
.setline{display:flex;align-items:center;gap:8px;padding:8px;margin:6px 0;background:#fff4e0;border:1px solid #ff9800;border-radius:6px;font-size:13px}
.setline .n{flex:1}.setline small{color:#666}
.off{color:#ffb74d}.setline .off{color:var(--red);font-weight:700}
.dhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.clear{background:#fff;color:var(--red);border:1px solid var(--red)!important}
</style>
</head>
<body>
<header>
  <h1>製品のご案内 レジ</h1>
  <button class="hbtn" id="clearAll">全件取消</button>
  <button class="mode" id="mode">＋ 追加</button>
</header>
<div id="app"></div>

<div class="detail" id="detail"></div>
<div class="bar">
  <div class="cnt" id="cnt">0点</div>
  <button id="toggle" style="background:#fff;color:#222">明細</button>
  <div class="tot" id="tot">¥0<small>税抜 ¥0</small></div>
</div>

    PROD[it.id]=it;})));});
GRID.forEach(g=>g.items.forEach(it=>{it.id='p'+(pid++);it.kana=g.kana;PROD[it.id]=it;}));
const BYIMG={};Object.values(PROD).forEach(it=>BYIMG[it.img]=it);
const SHORT_IDS=new Set(),SHORT_KEYS=[];PAGES.forEach(pg=>pg.rows.shorts.forEach(c=>c.items.forEach(it=>{SHORT_IDS.add(it.id);it.colors.forEach(k=>k&&SHORT_KEYS.push(it.id+'|'+k));})));
// 成立しうるセット候補（セット×色）
const CANDS=[];
SETS.forEach(s=>{
  const its=s.items.map(k=>BYIMG[k]);
  const cols=its[0].colors.filter(c=>c&&its.every(it=>it.colors.includes(c)));
  const normal=its.reduce((a,it)=>a+it.price,0)+SHORTS_PRICE*SHORTS_N;
  const normalEx=its.reduce((a,it)=>a+it.ex,0)+SHORTS_EX*SHORTS_N;
  cols.forEach(c=>{const shk=SHORT_KEYS.filter(k=>fam(k.split('|')[1])===fam(c));if(shk.length)CANDS.push({set:s,color:c,keys:its.map(it=>it.id+'|'+c),shk,normal,normalEx,save:normal-s.price,saveEx:normalEx-s.ex});});
});
// 一番お得になるセットの組み合わせを探索
function bestSets(){
  const cnt={},sh={};
  for(const[k,q]of Object.entries(state)){if(SHORT_IDS.has(k.split('|')[0])){const f=fam(k.split('|')[1]);sh[f]=(sh[f]||0)+q;}else cnt[k]=q;}
  const memo=new Map();
  function go(from){
    const key=from+'#'+JSON.stringify(sh)+'#'+JSON.stringify(cnt);
    if(memo.has(key))return memo.get(key);
    let best={save:0,list:[]};
    for(let i=from;i<CANDS.length;i++){
      const c=CANDS[i],f=fam(c.color);
      if((sh[f]||0)<SHORTS_N||!c.keys.every(k=>(cnt[k]||0)>0))continue;
      c.keys.forEach(k=>cnt[k]--);sh[f]-=SHORTS_N;
      const sub=go(i);
      c.keys.forEach(k=>cnt[k]++);sh[f]+=SHORTS_N;
      if(sub.save+c.save>best.save)best={save:sub.save+c.save,list:[c,...sub.list]};
    }
    memo.set(key,best);return best;
  }
  return go(0).list;
}

const yen=n=>'¥'+n.toLocaleString();
const btnHTML=(it,kana)=>it.colors.map(k=>k?`<div class="btn" data-key="${it.id}|${k}">${IMG[it.img+'_'+k]?`<img src="${IMG[it.img+'_'+k]}" alt="${C[k].l}">`:`<div class="noimg" style="background:${C[k].h};color:${C[k].d?'#333':'#fff'}">写真<br>なし</div>`}<span class="code" style="background:${C[k].h};color:${C[k].d?'#333':'#fff'}">${kana?C[k].l:(C[k].s||k)}</span><span class="q">0</span></div>`:`<div class="gap">—</div>`).join('');
const state={};let minus=false;

function render(){
  const app=document.getElementById('app');
  const card=(it,kana)=>`<div class="card">${it.series?`<div class="cser">${it.series}</div>`:''}<div class="cname">${it.name}</div>
     <div class="price">${yen(it.price)} <small>(${it.ex.toLocaleString()})</small></div>
     <div class="sw">${btnHTML(it,kana)}</div></div>`;
  const FROWS=ROWS.filter(([k])=>k!=='shorts');
  // A：ファンデーション（旧P.7・P.8の表、ショーツ行を除く）
  const secA=`<section class="page"><h2><span class="cat">A</span>ファンデーション</h2>`+PAGES.map(pg=>`
  <div class="scroll" style="margin-bottom:10px"><table>
   <thead><tr><th class="corner"></th>${pg.cols.map(c=>`<th><div class="cname">${c.name}</div><div class="csub">${c.sub}</div>
     <div class="hchips">${c.colors.map(k=>`<span class="hchip" style="background:${C[k].h};color:${C[k].d?'#333':'#fff'}">${C[k].l}(${k})</span>`).join('')}</div></th>`).join('')}</tr></thead>
   <tbody>${FROWS.map(([k,label])=>`<tr><th>${label}</th>${pg.rows[k].map(cell=>`
     <td colspan="${cell.span||1}">${cell.items.length?cell.items.map(it=>`
       <div class="item">
        <div class="iname">${it.name}</div>
        <div class="price">${yen(it.price)} <small>(${it.ex.toLocaleString()})</small></div>
        <div class="sw">${btnHTML(it)}</div>
       </div>`).join(''):'<div class="empty">—</div>'}</td>`).join('')}</tr>`).join('')}</tbody>
  </table></div>`).join('')+`</section>`;
  // B：ショーツ（旧P.7・P.8）
  const shorts=PAGES.flatMap(pg=>pg.rows.shorts.flatMap(c=>c.items));
  const secB=`<section class="page"><h2><span class="cat">B</span>ショーツ</h2><div class="grid wide">${shorts.map(it=>card(it)).join('')}</div></section>`;
  // C：ナイトシリーズ・Newドレアス・TOMONOKAIコレクション
  const secC=`<section class="page"><h2><span class="cat">C</span>ナイトシリーズ・Newドレアス・TOMONOKAIコレクション</h2><div class="grid">${GRID.flatMap(g=>g.items.map(it=>card(it,g.kana))).join('')}</div></section>`;
  app.innerHTML=secA+secB+secC;
}

function change(key,d){
  state[key]=Math.max(0,(state[key]||0)+d);
  if(!state[key])delete state[key];
  update();
}

function update(){
  document.querySelectorAll('.btn').forEach(b=>{
    const q=state[b.dataset.key]||0;
    b.classList.toggle('sel',q>0);b.querySelector('.q').textContent=q;});
  let tot=0,ex=0,cnt=0;const lines=[];
  Object.entries(state).forEach(([key,q])=>{
    const [id,c]=key.split('|');const it=PROD[id];
    tot+=it.price*q;ex+=it.ex*q;cnt+=q;lines.push({key,it,c,q});});
  const applied=bestSets();
  const save=applied.reduce((a,c)=>a+c.save,0),saveEx=applied.reduce((a,c)=>a+c.saveEx,0);
  // セットごとにまとめる
  const grp={};applied.forEach(c=>{const k=c.set.name+'|'+c.color;(grp[k]=grp[k]||{c,n:0}).n++;});
  document.getElementById('cnt').textContent=cnt+'点';
  document.getElementById('tot').innerHTML=yen(tot-save)+(save?`<small>通常 ${yen(tot)}　<b class="off">−${yen(save)} お得</b></small>`:'')+`<small>税抜 ${yen(ex-saveEx)}</small>`;
  const setHTML=Object.values(grp).map(({c,n})=>`<div class="setline"><div class="n"><b>セット：${c.set.name}</b>（${C[c.color].s||c.color}）×${n}<br>
    <small>${c.set.items.map(k=>BYIMG[k].name).join('・')}・ショーツ2枚（同色）</small><br>
    <small>通常 ${yen(c.normal*n)} → セット ${yen(c.set.price*n)}</small></div><div class="s off">−${yen(c.save*n)}</div></div>`).join('');
  document.getElementById('detail').innerHTML=`<div class="dhead"><b>明細</b>
    <button class="clear" onclick="clearAll(this)" style="padding:6px 10px;border-radius:6px">全件取消</button></div>`+
    setHTML+(lines.length?lines.map(l=>`<div class="line"><div class="n">${l.it.name}<br><small>${l.it.series?l.it.series+' / ':''}${l.it.kana?C[l.c].l:(C[l.c].s||l.c)} ${yen(l.it.price)}</small></div>
      <button onclick="change('${l.key}',-1)">−</button><b>${l.q}</b><button onclick="change('${l.key}',1)">＋</button>
      <div class="s">${yen(l.it.price*l.q)}</div></div>`).join(''):'<p style="color:#999;font-size:13px">まだ選択されていません</p>');
}

// 1回目のタップで確認表示、3秒以内に2回目のタップで全件取消（ダイアログ不使用）
let armed=null,armTimer=null;
function disarm(){if(armed){armed.textContent='全件取消';armed.classList.remove('armed');}armed=null;clearTimeout(armTimer);}
function clearAll(btn){
  if(!Object.keys(state).length){disarm();return;}
  if(armed===btn){disarm();for(const k in state)delete state[k];update();return;}
  disarm();armed=btn;btn.textContent='もう一度タップで取消';btn.classList.add('armed');
  armTimer=setTimeout(disarm,3000);
}
render();update();
document.getElementById('clearAll').onclick=e=>clearAll(e.currentTarget);
document.getElementById('app').addEventListener('click',e=>{
  const b=e.target.closest('.btn');if(!b)return;change(b.dataset.key,minus?-1:1);});
document.getElementById('mode').onclick=e=>{
  minus=!minus;e.target.textContent=minus?'− 取消':'＋ 追加';e.target.classList.toggle('minus',minus);};
document.getElementById('toggle').onclick=()=>document.getElementById('detail').classList.toggle('open');
</script>
